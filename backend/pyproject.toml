[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "website2video-backend"
version = "1.0.0"
description = "Transform any website into a professional AI-generated explainer video"
authors = [
    {name = "Website2Video Team", email = "team@website2video.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.5.0",
    "playwright>=1.41.0",
    "opencv-python>=4.9.0",
    "moviepy>=1.0.3",
    "pillow>=10.2.0",
    "numpy>=1.24.0",
    "elevenlabs>=1.0.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=1.39.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.2.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.poetry]
name = "website2video-backend"
version = "1.0.0"
description = "Transform any website into a professional AI-generated explainer video"
authors = ["Website2Video Team <team@website2video.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = "^5.0.0"
celery = "^5.3.0"
flower = "^2.0.0"
openai = "^1.10.0"
anthropic = "^0.18.0"
tiktoken = "^0.5.0"
playwright = "^1.41.0"
opencv-python = "^4.9.0"
moviepy = "^1.0.3"
pillow = "^10.2.0"
numpy = "^1.24.0"
elevenlabs = "^1.0.0"
boto3 = "^1.34.0"
minio = "^7.2.0"
prometheus-client = "^0.19.0"
sentry-sdk = "^1.39.0"
python-multipart = "^0.0.6"
httpx = "^0.26.0"
aiofiles = "^23.2.0"
tenacity = "^8.2.0"
python-jose = "^3.3.0"
passlib = "^1.7.0"
bcrypt = "^4.1.0"
cryptography = "^42.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"